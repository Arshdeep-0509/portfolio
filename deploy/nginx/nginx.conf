load_module /usr/lib/nginx/modules/ngx_http_brotli_filter_module.so;
load_module /usr/lib/nginx/modules/ngx_http_brotli_static_module.so;

user nginx;
worker_processes auto;
pid /run/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  server_tokens off;

  # Resumes are capped at 5 MB by the app; leave headroom for the rest of the form.
  client_max_body_size 7m;

  # Compression (Next.js's own compression is off in standalone builds).
  gzip on;
  gzip_vary on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types text/plain text/css text/xml application/json application/javascript
    application/xml application/rss+xml application/manifest+json image/svg+xml;

  brotli on;
  brotli_comp_level 5;
  brotli_min_length 1024;
  brotli_types text/plain text/css text/xml application/json application/javascript
    application/xml application/rss+xml application/manifest+json image/svg+xml;

  include /etc/nginx/http.d/*.conf;
}
